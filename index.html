<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XIROM423 - Catálogo Digital</title>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .pdf-container { width: 100vw; height: 100vh; display: none; }
        .active { display: block; }

        /* Ocultar interfaz nativa de dFlip */
        .df-ui-controls, .df-ui-wrapper, .df-ui-btn { display: none !important; }

        .brand-logo {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10000;
            max-width: 100px;
        }

        /* Barra de navegación fija */
        .nav-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10000;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn:hover { background-color: #0056b3; }

        /* Panel de contacto (derecha inferior) */
        .contact-sidebar {
            position: fixed;
            bottom: 25px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10000;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-label {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .contact-item:hover .contact-label { opacity: 1; transform: translateX(0); }

        .btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            border: none;
            cursor: pointer;
        }

        .whatsapp-bg { background-color: #25d366; }
        .instagram-bg { background-image: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .email-bg { background-color: #007bff; }

        /* Ajustes móviles */
        @media (max-width: 768px) {
            .brand-logo { max-width: 70px; }
            .nav-btn { font-size: 12px; padding: 6px 10px; }
            .contact-label { display: none !important; } /* ocultar nombres en móvil */
            .btn-icon { width: 42px; height: 42px; font-size: 16px; }
        }
    </style>

    <link rel="stylesheet" href="dflip.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <img src="logo.png" alt="XIROM423 Logo" class="brand-logo">

    <!-- Barra de navegación fija -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="mostrarPDF('catalogo')">Catálogo</button>
        <button class="nav-btn" onclick="mostrarPDF('portafolio')">Portafolio</button>
        <button class="nav-btn" onclick="mostrarPDF('inicio')">Inicio</button>
    </div>

    <!-- Panel de contacto -->
    <div class="contact-sidebar">
        <a href="mailto:xirom432@gmail.com?subject=Envío de Archivos - XIROM&body=Hola XIROM, adjunto archivos..." class="contact-item">
            <span class="contact-label">Enviar Archivos</span>
            <div class="btn-icon email-bg"><i class="fas fa-file-upload"></i></div>
        </a>

        <div onclick="enviarWhatsApp()" class="contact-item">
            <span class="contact-label">Cotizaciones</span>
            <div class="btn-icon whatsapp-bg"><i class="fab fa-whatsapp"></i></div>
        </div>

        <a href="https://www.instagram.com/xirom423" target="_blank" class="contact-item">
            <span class="contact-label">Síguenos</span>
            <div class="btn-icon instagram-bg"><i class="fab fa-instagram"></i></div>
        </a>
    </div>

    <!-- Contenedores -->
    <div id="catalogo-container" class="pdf-container active"></div>
    <div id="portafolio-container" class="pdf-container"></div>
    <div id="inicio-container" class="pdf-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="dflip.min.js"></script>

    <script>
        var whatsappNumber = "5215514416990"; 
        var archivoCatalogo = "catalogo_xirom.pdf";
        var archivoPortafolio = "portafolio_temporada.pdf";
        var archivoInicio = "inicio.pdf"; // opcional, puede ser portada o presentación

        function enviarWhatsApp() {
            var nombre = prompt("¿Cómo te llamas?");
            var mensaje = (nombre != null && nombre != "") 
                ? "¡Hola XIROM423! Mi nombre es " + nombre + ". Me interesa una cotización personalizada."
                : "¡Hola XIROM423! Me interesa recibir más información.";
            window.open("https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(mensaje), '_blank');
        }

        function mostrarPDF(seccion) {
            document.querySelectorAll(".pdf-container").forEach(el => el.classList.remove("active"));
            document.getElementById(seccion + "-container").classList.add("active");
        }

        $(document).ready(function () {
            if (typeof $.fn.flipBook !== 'undefined') {
                $("#catalogo-container").flipBook(archivoCatalogo, {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: "#121212",
                    responsiveView: true,
                    singlePageMode: 'auto'
                });

                $("#portafolio-container").flipBook(archivoPortafolio, {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: "#121212",
                    responsiveView: true,
                    singlePageMode: 'auto'
                });

                $("#inicio-container").flipBook(archivoInicio, {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: "#121212",
                    responsiveView: true,
                    singlePageMode: 'auto'
                });
            }
        });
    </script>
</body>
</html>
